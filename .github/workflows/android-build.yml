name: Android build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify all native libraries are packaged
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          for LIB in lib7sven_jni.so libllama.so libggml.so libggml-base.so libggml-cpu.so; do
            test -f "app/src/main/jniLibs/arm64-v8a/$LIB" || { echo "::error::Missing source library: $LIB"; exit 1; }
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$LIB" || { echo "::error::APK does not package $LIB."; exit 1; }
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 7SVEN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
