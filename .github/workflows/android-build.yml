name: Android build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify native runtime is packaged
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libllama.so || { echo "::error::Missing libllama.so. The JNI bridge requires the matching llama.cpp runtime."; exit 1; }
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libllama.so' || { echo "::error::APK does not package libllama.so."; exit 1; }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 7SVEN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
